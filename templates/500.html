{% extends "base.html" %}

{% block title %}Internal Server Error{% endblock %}
{% block breadcrumb %}Error 500{% endblock %}

{% block content %}
<div class="empty-state">
    <i class="ph ph-bug empty-state-icon" style="color: var(--color-danger);"></i>
    <h2 class="empty-state-title">Internal Server Error (500)</h2>
    <p class="empty-state-desc">Something went wrong on our end. Please try again later.</p>
    
    <a href="{{ url_for('main.upload') }}" class="btn btn-primary">
        <i class="ph ph-house"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
